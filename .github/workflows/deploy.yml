name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (with diagnostics)
        run: |
          {
            echo "node=$(node -v) npm=$(npm -v) os=$(uname -m) platform=$(uname -s)"
            echo "CHECK esbuild linux:"; ls node_modules/@esbuild/ 2>&1
            echo "CHECK oxide:"; ls node_modules/@tailwindcss/ 2>&1 | tr '\n' ' '; echo
            echo "=== running vite build ==="
            npx vite build 2>&1
            echo "=== exit $? ==="
          } | tee build-log.txt
          ec=${PIPESTATUS[0]}
          echo "GOT_ESBUILD_LINUX=$(ls node_modules/@esbuild/ 2>/dev/null | tr '\n' ' ')" >> build-log.txt
          echo "exit=$ec" >> build-log.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f build-log.txt 2>/dev/null
          git commit -q -m "ci: build diagnostics log [ci skip]" 2>/dev/null
          git push -f origin HEAD:fix/ci-log 2>&1 | tail -1
          exit $ec

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment