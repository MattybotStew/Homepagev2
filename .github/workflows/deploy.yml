name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: echo "node=$(node -v) npm=$(npm -v) os=$(uname -m) platform=$(uname -s)" | tee -a $GITHUB_STEP_SUMMARY
      - name: Diagnose build
        run: |
          {
            echo "node=$(node -v) npm=$(npm -v) os=$(uname -m) platform=$(uname -s)"
            ls node_modules/.bin/vite && echo "vite bin exists"
            ls node_modules/@esbuild/linux-x64/ 2>&1 || echo "no esbuild linux, listing:"; ls node_modules/@esbuild/ 2>&1
            echo "=== running vite build ==="
            npx vite build 2>&1
            echo "=== exit $? ==="
          } | tee /tmp/build.log
          ec=${PIPESTATUS[0]}
          cp /tmp/build.log build-log.txt
          exit $ec
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build-log.txt
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment