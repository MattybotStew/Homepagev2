name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include-scripts
      - name: Diagnose build
        run: |
          echo "node=$(node -v) npm=$(npm -v)"
          npx vite build > /tmp/build.log 2>&1
          ec=$?
          echo "exitcode=$ec"
          if [ $ec -ne 0 ]; then
            echo "::error::VITE BUILD FAILED (exit $ec)"
            sed -n '1,40p' /tmp/build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $ec

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment